<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenKen Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      
      canvas.emscripten {
        border: 0 none;
        background-color: #000;
        outline: none;
      }

      /* Loading Screen */
      #loading-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #111;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99;
        transition: opacity 0.3s ease;
        pointer-events: none;
      }

      .spinner {
        width: 50px;
        height: 50px;
        border: 5px solid #333;
        border-top: 5px solid #4CAF50;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #status-text {
        font-size: 1.2rem;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <div id="loading-overlay">
      <div class="spinner"></div>
      <div id="status-text">Loading...</div>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type="text/javascript">
      var statusText = document.getElementById('status-text');
      var loadingOverlay = document.getElementById('loading-overlay');

      function removeOverlay() {
        if (!loadingOverlay) return;
        loadingOverlay.style.opacity = '0';
        setTimeout(function() {
          loadingOverlay.style.display = 'none';
        }, 300);
      }

      var Module = {
        preRun: [],
        postRun: [],
        
        // Emscripten hook: Triggers as soon as Wasm finishes compiling & engine starts
        onRuntimeInitialized: function() {
          removeOverlay();
        },

        print: console.log,
        printErr: console.error,
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { 
            alert('WebGL context lost. Please reload.'); 
            e.preventDefault(); 
          }, false);
          return canvas;
        })(),

        // Show download progress text, but don't show "Running..."
        setStatus: function(text) {
          if (text && text.indexOf('Running') === -1) {
            statusText.innerHTML = text;
          }
        }
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
