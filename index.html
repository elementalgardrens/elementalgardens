<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KenKen Game</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        background-color: #000;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
      }
      
      canvas.emscripten {
        border: 0 none;
        background-color: #000;
        outline: none;
      }

      /* Overlay screen */
      #start-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background-color: #111;
        color: #fff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 99;
        transition: opacity 0.3s ease;
      }

      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid #333;
        border-top: 4px solid #4CAF50;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-bottom: 20px;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      #start-btn {
        display: none;
        padding: 15px 32px;
        font-size: 1.2rem;
        font-weight: bold;
        color: #fff;
        background-color: #4CAF50;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        transition: background-color 0.2s ease, transform 0.1s ease;
      }

      #start-btn:hover {
        background-color: #45a049;
        transform: scale(1.05);
      }

      #status-text {
        font-size: 1.1rem;
        letter-spacing: 1px;
      }
    </style>
  </head>
  <body>

    <!-- Combined Loading & Click-to-Play Overlay -->
    <div id="start-overlay">
      <div id="loader" class="spinner"></div>
      <div id="status-text">Loading game...</div>
      <button id="start-btn" onclick="startGame()">Click to Play</button>
    </div>

    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>

    <script type="text/javascript">
      var statusText = document.getElementById('status-text');
      var loader = document.getElementById('loader');
      var startBtn = document.getElementById('start-btn');
      var startOverlay = document.getElementById('start-overlay');
      var gameReady = false;

      function startGame() {
        if (!gameReady) return;

        // Resume browser WebAudio context via user gesture
        if (typeof SDL2 !== 'undefined' && SDL2.audioContext) {
          SDL2.audioContext.resume();
        }

        // Hide overlay and reveal game
        startOverlay.style.opacity = '0';
        setTimeout(function() {
          startOverlay.style.display = 'none';
        }, 300);
      }

      var Module = {
        preRun: [],
        postRun: [],
        
        // Triggered when assets & WebAssembly finish initializing
        onRuntimeInitialized: function() {
          gameReady = true;
          loader.style.display = 'none';
          statusText.style.display = 'none';
          startBtn.style.display = 'block'; // Reveal "Click to Play" button!
        },

        print: console.log,
        printErr: console.error,
        canvas: (function() {
          var canvas = document.getElementById('canvas');
          canvas.addEventListener("webglcontextlost", function(e) { 
            alert('WebGL context lost. Please reload.'); 
            e.preventDefault(); 
          }, false);
          return canvas;
        })(),

        setStatus: function(text) {
          if (text && text.indexOf('Running') === -1) {
            statusText.innerHTML = text;
          }
        }
      };
    </script>
    <script async type="text/javascript" src="index.js"></script>
  </body>
</html>
